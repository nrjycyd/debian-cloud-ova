name: 🚀 构建并发布 Debian OVA

on:
  workflow_dispatch:
    inputs:
      debian_version:
        description: 'Debian 版本（默认：12/bookworm）'
        required: true
        default: '12 (bookworm)'
        type: choice
        options:
          - '11 (bullseye)'
          - '12 (bookworm)'
          - '13 (trixie)'
      vcpu:
        description: 'vCPU 数量（默认：2）'
        required: false
        default: '2'
      memory:
        description: '内存大小（MB，默认：1024）'
        required: false
        default: '1024'
      disk_size:
        description: '磁盘大小（GB，默认：10）'
        required: false
        default: '10'
      esxi_hardware:
        description: 'ESXi 虚拟机硬件版本（最低 vmx-14，默认：vmx-14）'
        required: false
        default: 'vmx-14 (ESXi 6.7)'
        type: choice
        options:
          - 'vmx-14 (ESXi 6.7)'
          - 'vmx-15 (ESXi 7.0)'
          - 'vmx-17 (ESXi 7.0 U1+)'
          - 'vmx-19 (ESXi 7.0 U2+)'
          - 'vmx-20 (ESXi 8.0)'
          - 'vmx-21 (ESXi 8.0 U1)'
          - 'vmx-22 (ESXi 8.0 U2)'
      guest_os:
        description: 'OVF Guest OS 标识（默认：Debian 11；Debian 12/13 选项需 ESXi 8.0+）'
        required: false
        default: '96/debian11_64Guest (Debian 11)'
        type: choice
        options:
          - '96/debian11_64Guest (Debian 11)'
          - '96/debian12_64Guest (Debian 12)'
          - '96/debian13_64Guest (Debian 13)'
          - '101/debian10_64Guest (Debian 10)'
      hostname:
        description: '主机名（默认：debian-cloud）'
        required: false
        default: 'debian-cloud'
      username:
        description: '默认用户名（默认：debian）'
        required: false
        default: 'debian'
      password:
        description: '用户密码（默认：123456）'
        required: false
        default: '123456'
      release_tag:
        description: 'Git 发布标签（如 v1.0.0）'
        required: true
        default: 'v1.0.0'

jobs:
  build_ova:
    runs-on: ubuntu-latest
    
    env:
      TARGET_VERSION: ${{ github.event.inputs.debian_version }}
      TARGET_VCPU: ${{ github.event.inputs.vcpu }}
      TARGET_MEMORY: ${{ github.event.inputs.memory }}
      TARGET_DISK: ${{ github.event.inputs.disk_size }}
      TARGET_VMX: ${{ github.event.inputs.esxi_hardware }}
      TARGET_HOSTNAME: ${{ github.event.inputs.hostname }}
      TARGET_USERNAME: ${{ github.event.inputs.username }}
      TARGET_PASSWORD: ${{ github.event.inputs.password }}
      RELEASE_TAG: ${{ github.event.inputs.release_tag }}
      TARGET_GUEST_OS: ${{ github.event.inputs.guest_os }}

    steps:
      - name: 📥 检出仓库
        uses: actions/checkout@v7
        
      - name: 📦 安装依赖
        run: |
          echo "正在安装依赖..."
          sudo apt update -qq
          sudo apt install -y wget qemu-utils cloud-image-utils
          echo "✅ 依赖安装完成"

      - name: 🔨 构建 OVA
        id: build
        run: |
          chmod +x ./debian-ova-creator.sh
          
          echo "开始构建 OVA，参数如下："
          echo "  Debian 版本: ${{ env.TARGET_VERSION }}"
          echo "  vCPU: ${{ env.TARGET_VCPU }}"
          echo "  内存: ${{ env.TARGET_MEMORY }}MB"
          echo "  磁盘: ${{ env.TARGET_DISK }}GB"
          echo "  ESXi 机型: ${{ env.TARGET_VMX }}"
          echo "  主机名: ${{ env.TARGET_HOSTNAME }}"
          echo "  用户名: ${{ env.TARGET_USERNAME }}"
          echo "  Guest OS: ${{ env.TARGET_GUEST_OS }}"
          
          # 传给脚本前解析机型部分（选项值带说明，取空格前为 vmx-XX）
          export VIRTUAL_SYSTEM_TYPE="${TARGET_VMX%% *}"
          # 解析 Guest OS 标识（ID/osType，取空格前的 96/debian11_64Guest 形式）
          export OVF_OS_ID="${TARGET_GUEST_OS%%/*}"
          export OVF_OS_TYPE="${TARGET_GUEST_OS#*/}"
          export OVF_OS_TYPE="${OVF_OS_TYPE%% *}"
          
          # 传给脚本前解析版本部分（选项值带说明，取空格前为版本号/代号）
          ./debian-ova-creator.sh \
            -d "${TARGET_VERSION%% *}" \
            -c "${{ env.TARGET_VCPU }}" \
            -m "${{ env.TARGET_MEMORY }}" \
            -s "${{ env.TARGET_DISK }}" \
            -H "${{ env.TARGET_HOSTNAME }}" \
            -u "${{ env.TARGET_USERNAME }}" \
            -p "${{ env.TARGET_PASSWORD }}"
          
          # 查找生成的 OVA 文件
          FILE_NAME=$(ls debian-*-genericcloud-amd64*.ova 2>/dev/null | head -1)
          if [ -z "$FILE_NAME" ]; then
              echo "❌ 错误：未找到 OVA 文件"
              ls -la
              exit 1
          fi
          
          FILE_SIZE=$(du -h "$FILE_NAME" | cut -f1)
          echo "✅ 构建完成：$FILE_NAME（$FILE_SIZE）"
          
          echo "OVA_FILE_NAME=$FILE_NAME" >> $GITHUB_OUTPUT
          echo "OVA_FILE_SIZE=$FILE_SIZE" >> $GITHUB_OUTPUT

      - name: 🚀 创建 GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.build.outputs.OVA_FILE_NAME }}
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Debian ${{ env.TARGET_VERSION }} OVA - ${{ env.RELEASE_TAG }}"
          body: |
            ## 🎉 Debian 云镜像 OVA
            
            **构建配置：**
            - Debian 版本：**${{ env.TARGET_VERSION }}**
            - vCPU：**${{ env.TARGET_VCPU }}**
            - 内存：**${{ env.TARGET_MEMORY }}MB**
            - 磁盘大小：**${{ env.TARGET_DISK }}GB**
            - ESXi 机型版本：**${{ env.TARGET_VMX }}**
            - 主机名：**${{ env.TARGET_HOSTNAME }}**
            - 默认用户：**${{ env.TARGET_USERNAME }}**
            - 文件大小：**${{ steps.build.outputs.OVA_FILE_SIZE }}**
            - 构建时间：**$(date -u +'%Y-%m-%d %H:%M:%S UTC')**
            
            **快速开始：**
            1. 从 Release 资产中下载 OVA 文件
            2. 导入 VMware 或兼容的虚拟化平台
            3. 开机并使用以下凭据登录：
               - 用户名：`${{ env.TARGET_USERNAME }}`
               - 密码：`${{ env.TARGET_PASSWORD }}`
            
            **Cloud-Init 支持：**
            - 自定义主机名配置
            - 创建带 sudo 权限的用户账户
            - SSH 公钥注入（如提供）
            - 执行 user-data 脚本
            
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📊 构建摘要
        if: always()
        run: |
          echo ""
          echo "╔════════════════════════════════════════╗"
          echo "║      Debian OVA 构建完成           ║"
          echo "╠════════════════════════════════════════╣"
          echo "║ 版本: ${{ env.TARGET_VERSION }}"
          echo "║ vCPU: ${{ env.TARGET_VCPU }}"
          echo "║ 内存: ${{ env.TARGET_MEMORY }}MB"
          echo "║ 磁盘: ${{ env.TARGET_DISK }}GB"
          echo "║ ESXi 机型: ${{ env.TARGET_VMX }}"
          echo "║ 主机名: ${{ env.TARGET_HOSTNAME }}"
          echo "║ 用户名: ${{ env.TARGET_USERNAME }}"
          echo "║ 标签: ${{ env.RELEASE_TAG }}"
          if [ -n "${{ steps.build.outputs.OVA_FILE_NAME }}" ]; then
            echo "║ 文件: ${{ steps.build.outputs.OVA_FILE_NAME }}"
            echo "║ 大小: ${{ steps.build.outputs.OVA_FILE_SIZE }}"
          fi
          echo "╚════════════════════════════════════════╝"
          echo ""

      - name: 🧹 清理
        if: always()
        run: |
          rm -f *.qcow2 *.vmdk *.ovf *.mf *.ova 2>/dev/null || true
          echo "✅ 清理完成"
