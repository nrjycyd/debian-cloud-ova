name: 🚀 构建并发布 Debian OVA

on:
  workflow_dispatch:
    inputs:
      debian_version:
        description: 'Debian 版本（默认：12/bookworm）'
        required: true
        default: '13'
        type: choice
        options:
          - '11'
          - '12'
          - '13'
      vcpu:
        description: 'vCPU 数量（默认：2）'
        required: false
        default: '2'
      memory:
        description: '内存大小（MB，默认：1024）'
        required: false
        default: '1024'
      disk_size:
        description: '磁盘大小（GB，默认：10）'
        required: false
        default: '10'
      esxi_hardware:
        description: 'ESXi 虚拟机硬件版本（最低 vmx-14，默认：vmx-14）'
        required: false
        default: 'vmx-14 (ESXi 6.7)'
        type: choice
        options:
          - 'vmx-14 (ESXi 6.7)'
          - 'vmx-15 (ESXi 7.0)'
          - 'vmx-17 (ESXi 7.0 U1+)'
          - 'vmx-19 (ESXi 7.0 U2+)'
          - 'vmx-20 (ESXi 8.0)'
          - 'vmx-21 (ESXi 8.0 U1)'
          - 'vmx-22 (ESXi 8.0 U2)'
      guest_os:
        description: 'OVF Guest OS 标识（默认：DGNU 11）'
        required: false
        default: 'DGNU 11, ESXi 7.0 U3~8.0'
        type: choice
        options:
          - 'DGNU 9, ESXi ≤6.7'
          - 'DGNU 10, ESXi 6.7 U3~7.0'
          - 'DGNU 11, ESXi 7.0 U3~8.0'
          - 'DGNU 12, ESXi 8.0~8.0 U2'
          - 'DGNU 13, ESXi 8.0 U3+'
      hostname:
        description: '主机名（默认：debian-cloud）'
        required: false
        default: 'debian-cloud'
      username:
        description: '默认用户名（默认：debian）'
        required: false
        default: 'debian'
      password:
        description: '用户密码（默认：123456）'
        required: false
        default: '123456'
      release_tag:
        description: 'Git 发布标签（如 v1.0.0）'
        required: true
        default: 'v1.0.0'

jobs:
  build_ova:
    runs-on: ubuntu-latest
    
    env:
      TARGET_VERSION: ${{ github.event.inputs.debian_version }}
      TARGET_VCPU: ${{ github.event.inputs.vcpu }}
      TARGET_MEMORY: ${{ github.event.inputs.memory }}
      TARGET_DISK: ${{ github.event.inputs.disk_size }}
      TARGET_VMX: ${{ github.event.inputs.esxi_hardware }}
      TARGET_HOSTNAME: ${{ github.event.inputs.hostname }}
      TARGET_USERNAME: ${{ github.event.inputs.username }}
      TARGET_PASSWORD: ${{ github.event.inputs.password }}
      RELEASE_TAG: ${{ github.event.inputs.release_tag }}
      TARGET_GUEST_OS: ${{ github.event.inputs.guest_os }}

    steps:
      - name: 📥 检出仓库
        uses: actions/checkout@v7
        
      - name: 📦 安装依赖
        run: |
          echo "正在安装依赖..."
          sudo apt update -qq
          sudo apt install -y wget qemu-utils cloud-image-utils
          echo "✅ 依赖安装完成"

      - name: 🔨 构建 OVA
        id: build
        run: |
          chmod +x ./debian-ova-creator.sh
          
          # 参数校验（上限防止生成非法 OVF，hostname/密码防 cloud-init 配置破坏）
          if ! [[ "${{ env.TARGET_VCPU }}" =~ ^[0-9]+$ ]] || [ "${{ env.TARGET_VCPU }}" -lt 1 ] || [ "${{ env.TARGET_VCPU }}" -gt 64 ]; then
              echo "❌ 错误：vCPU 必须在 1-64 之间"; exit 1
          fi
          if ! [[ "${{ env.TARGET_MEMORY }}" =~ ^[0-9]+$ ]] || [ "${{ env.TARGET_MEMORY }}" -lt 256 ] || [ "${{ env.TARGET_MEMORY }}" -gt 262144 ]; then
              echo "❌ 错误：内存必须在 256-262144 MB 之间"; exit 1
          fi
          if ! [[ "${{ env.TARGET_DISK }}" =~ ^[0-9]+$ ]] || [ "${{ env.TARGET_DISK }}" -lt 2 ] || [ "${{ env.TARGET_DISK }}" -gt 2048 ]; then
              echo "❌ 错误：磁盘必须在 2-2048 GB 之间"; exit 1
          fi
          if ! [[ "${{ env.TARGET_HOSTNAME }}" =~ ^[a-zA-Z0-9][a-zA-Z0-9-]{0,62}$ ]]; then
              echo "❌ 错误：主机名不合法（字母/数字/连字符，≤63 字符）"; exit 1
          fi
          if [[ -z "${{ env.TARGET_PASSWORD }}" ]] || [[ "${{ env.TARGET_PASSWORD }}" == *:* ]]; then
              echo "❌ 错误：密码不能为空或含冒号"; exit 1
          fi
          
          echo "开始构建 OVA，参数如下："
          echo "  Debian 版本: ${{ env.TARGET_VERSION }}"
          echo "  vCPU: ${{ env.TARGET_VCPU }}"
          echo "  内存: ${{ env.TARGET_MEMORY }}MB"
          echo "  磁盘: ${{ env.TARGET_DISK }}GB"
          echo "  ESXi 机型: ${{ env.TARGET_VMX }}"
          echo "  主机名: ${{ env.TARGET_HOSTNAME }}"
          echo "  用户名: ${{ env.TARGET_USERNAME }}"
          echo "  Guest OS: ${{ env.TARGET_GUEST_OS }}"
          
          # 传给脚本前解析机型部分（选项值带说明，取空格前为 vmx-XX）
          export VIRTUAL_SYSTEM_TYPE="${TARGET_VMX%% *}"
          # 解析 Guest OS 标识（选项为友好文本，映射回 OVF ID/osType）
          case "${TARGET_GUEST_OS%%,*}" in
            "DGNU 9")  export OVF_OS_ID=96;  export OVF_OS_TYPE=debian9_64Guest ;;
            "DGNU 10") export OVF_OS_ID=101; export OVF_OS_TYPE=debian10_64Guest ;;
            "DGNU 11") export OVF_OS_ID=96;  export OVF_OS_TYPE=debian11_64Guest ;;
            "DGNU 12") export OVF_OS_ID=96;  export OVF_OS_TYPE=debian12_64Guest ;;
            "DGNU 13") export OVF_OS_ID=96;  export OVF_OS_TYPE=debian13_64Guest ;;
            *) echo "❌ 错误：不支持的 Guest OS 选项: $TARGET_GUEST_OS"; exit 1 ;;
          esac
          
          # 联动校验：Guest OS 所需 ESXi 下限 vs 机型 vmx（防止 6.7 机型配 8.0 的 osType）
          case "${TARGET_GUEST_OS%%,*}" in
            "DGNU 9"|"DGNU 10") MIN_VMX="vmx-14" ;;
            "DGNU 11") MIN_VMX="vmx-19" ;;
            "DGNU 12") MIN_VMX="vmx-20" ;;
            "DGNU 13") MIN_VMX="vmx-22" ;;
          esac
          VMX_NUM=$((10#${VIRTUAL_SYSTEM_TYPE#vmx-}))
          MIN_NUM=$((10#${MIN_VMX#vmx-}))
          if [ "$VMX_NUM" -lt "$MIN_NUM" ]; then
              echo "❌ 错误：${{ env.TARGET_GUEST_OS }} 需要机型 $MIN_VMX 及以上，当前 $VIRTUAL_SYSTEM_TYPE 不满足"
              exit 1
          fi
          
          # 传给脚本前解析版本部分（选项值带说明，取空格前为版本号/代号）
          ./debian-ova-creator.sh \
            -d "${TARGET_VERSION%% *}" \
            -c "${{ env.TARGET_VCPU }}" \
            -m "${{ env.TARGET_MEMORY }}" \
            -s "${{ env.TARGET_DISK }}" \
            -H "${{ env.TARGET_HOSTNAME }}" \
            -u "${{ env.TARGET_USERNAME }}" \
            -p "${{ env.TARGET_PASSWORD }}"
          
          # 查找本次构建生成的 OVA（只匹配新命名格式，不会误选之前的旧版本文件）
          FILE_NAME=$(ls debian*-generic-cloud-*.ova 2>/dev/null | head -1)
          if [ -z "$FILE_NAME" ]; then
              echo "❌ 错误：未找到 OVA 文件"
              ls -la
              exit 1
          fi
          
          FILE_SIZE=$(du -h "$FILE_NAME" | cut -f1)
          echo "✅ 构建完成：$FILE_NAME（$FILE_SIZE）"
          
          # 解析 Debian 官方 build 号（latest 目录页中最大 YYYYMMDD-NNNN），追加到发布标签
          case "${TARGET_VERSION%% *}" in
            11) CODENAME="bullseye" ;;
            12) CODENAME="bookworm" ;;
            13) CODENAME="trixie" ;;
          esac
          DEBIAN_BUILD=$(curl -s "https://cloud.debian.org/images/cloud/${CODENAME}/" | grep -oE '[0-9]{8}-[0-9]+/' | sort -u | tail -1 | tr -d '/')
          echo "✅ Debian 官方 build 号：$DEBIAN_BUILD"
          
          echo "OVA_FILE_NAME=$FILE_NAME" >> $GITHUB_OUTPUT
          echo "OVA_FILE_SIZE=$FILE_SIZE" >> $GITHUB_OUTPUT
          echo "BUILD_TIME=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT
          echo "DEBIAN_BUILD=$DEBIAN_BUILD" >> $GITHUB_OUTPUT
          echo "FINAL_TAG=${{ env.RELEASE_TAG }}-${DEBIAN_BUILD}" >> $GITHUB_OUTPUT

      - name: 🚀 创建 GitHub Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_NOTES=$(cat <<'EOF'
          ## 🎉 Debian 云镜像 OVA

          **构建配置：**
          - Debian 版本：**${{ env.TARGET_VERSION }}**
          - Debian Build 号：**${{ steps.build.outputs.DEBIAN_BUILD }}**
          - vCPU：**${{ env.TARGET_VCPU }}**
          - 内存：**${{ env.TARGET_MEMORY }}MB**
          - 磁盘大小：**${{ env.TARGET_DISK }}GB**
          - ESXi 机型版本：**${{ env.TARGET_VMX }}**
          - 主机名：**${{ env.TARGET_HOSTNAME }}**
          - 默认用户：**${{ env.TARGET_USERNAME }}**
          - 文件大小：**${{ steps.build.outputs.OVA_FILE_SIZE }}**
          - 构建时间：**${{ steps.build.outputs.BUILD_TIME }}**

          **快速开始：**
          1. 从 Release 资产中下载 OVA 文件
          2. 导入 VMware 或兼容的虚拟化平台
          3. 开机并使用以下凭据登录：
             - 用户名：`${{ env.TARGET_USERNAME }}`
             - 密码：`${{ env.TARGET_PASSWORD }}`

          **Cloud-Init 支持：**
          - 自定义主机名配置
          - 创建带 sudo 权限的用户账户
          - SSH 公钥注入（如提供）
          - 执行 user-data 脚本
          EOF
          )

          # 同 tag 复用：Release 已存在则追加 OVA 资产（保留之前编译的其他 ESXi 版本镜像），不存在则创建
          if gh release view "${{ steps.build.outputs.FINAL_TAG }}" >/dev/null 2>&1; then
              gh release upload "${{ steps.build.outputs.FINAL_TAG }}" \
                "${{ steps.build.outputs.OVA_FILE_NAME }}" --clobber
              echo "✅ Release 已存在，OVA 已追加：${{ steps.build.outputs.OVA_FILE_NAME }}"
          else
              gh release create "${{ steps.build.outputs.FINAL_TAG }}" \
                "${{ steps.build.outputs.OVA_FILE_NAME }}" \
                --title "Debian ${{ env.TARGET_VERSION }} OVA - ${{ steps.build.outputs.FINAL_TAG }}" \
                --notes "$RELEASE_NOTES"
              echo "✅ Release 创建完成：${{ steps.build.outputs.FINAL_TAG }}"
          fi

      - name: 📊 构建摘要
        if: always()
        run: |
          echo ""
          echo "╔════════════════════════════════════════╗"
          echo "║      Debian OVA 构建完成           ║"
          echo "╠════════════════════════════════════════╣"
          echo "║ 版本: ${{ env.TARGET_VERSION }}"
          echo "║ vCPU: ${{ env.TARGET_VCPU }}"
          echo "║ 内存: ${{ env.TARGET_MEMORY }}MB"
          echo "║ 磁盘: ${{ env.TARGET_DISK }}GB"
          echo "║ ESXi 机型: ${{ env.TARGET_VMX }}"
          echo "║ 主机名: ${{ env.TARGET_HOSTNAME }}"
          echo "║ 用户名: ${{ env.TARGET_USERNAME }}"
          echo "║ 标签: ${{ steps.build.outputs.FINAL_TAG }}"
          if [ -n "${{ steps.build.outputs.OVA_FILE_NAME }}" ]; then
            echo "║ 文件: ${{ steps.build.outputs.OVA_FILE_NAME }}"
            echo "║ 大小: ${{ steps.build.outputs.OVA_FILE_SIZE }}"
          fi
          echo "╚════════════════════════════════════════╝"
          echo ""

      - name: 🧹 清理
        if: always()
        run: |
          rm -f *.qcow2 *.vmdk *.ovf *.mf *.ova cidata.iso 2>/dev/null || true
          echo "✅ 清理完成"
