name: 构建并发布 Debian OVA

on:
  workflow_dispatch:
    inputs:
      debian_version:
        description: 'Debian 系统版本'
        required: true
        default: '13'
        type: choice
        options:
          - '11'
          - '12'
          - '13'
      build_target:
        description: 'ESXi 机型 + Guest OS'
        required: true
        default: 'ESXi 9.0+ + DGNU 13 (vmx-22)'
        type: choice
        options:
          - 'ESXi 6.7 + DGNU 9 (vmx-14)'
          - 'ESXi 6.7 U3 + DGNU 10 (vmx-14)'
          - 'ESXi 6.7 U2+ + DGNU 9 (vmx-15)'
          - 'ESXi 6.7 U3 + DGNU 10 (vmx-15)'
          - 'ESXi 7.0 + DGNU 9 (vmx-17)'
          - 'ESXi 7.0 + DGNU 10 (vmx-17)'
          - 'ESXi 7.0 U1 + DGNU 9 (vmx-18)'
          - 'ESXi 7.0 U1 + DGNU 10 (vmx-18)'
          - 'ESXi 7.0 U2/U3 + DGNU 9 (vmx-19)'
          - 'ESXi 7.0 U2/U3 + DGNU 10 (vmx-19)'
          - 'ESXi 7.0 U3 + DGNU 11 (vmx-19)'
          - 'ESXi 8.0 / 8.0 U1 + DGNU 9 (vmx-20)'
          - 'ESXi 8.0 / 8.0 U1 + DGNU 10 (vmx-20)'
          - 'ESXi 8.0 / 8.0 U1 + DGNU 11 (vmx-20)'
          - 'ESXi 8.0 / 8.0 U1 + DGNU 12 (vmx-20)'
          - 'ESXi 8.0 U2/U3 + DGNU 9 (vmx-21)'
          - 'ESXi 8.0 U2/U3 + DGNU 10 (vmx-21)'
          - 'ESXi 8.0 U2/U3 + DGNU 11 (vmx-21)'
          - 'ESXi 8.0 U2/U3 + DGNU 12 (vmx-21)'
          - 'ESXi 8.0 U3 + DGNU 13 (vmx-21)'
          - 'ESXi 9.0+ + DGNU 9 (vmx-22)'
          - 'ESXi 9.0+ + DGNU 10 (vmx-22)'
          - 'ESXi 9.0+ + DGNU 11 (vmx-22)'
          - 'ESXi 9.0+ + DGNU 12 (vmx-22)'
          - 'ESXi 9.0+ + DGNU 13 (vmx-22)'
      vcpu:
        description: 'vCPU'
        required: false
        default: '2'
      memory:
        description: '内存（MB）'
        required: false
        default: '1024'
      disk_size:
        description: '磁盘（GB）'
        required: false
        default: '4'
      hostname:
        description: '主机名'
        required: false
        default: 'debian-cloud'
      enable_ssh:
        description: '启用 SSH'
        required: false
        default: false
        type: boolean
      username:
        description: '用户名（非 SSH 镜像）'
        required: false
        default: 'debian'
      password:
        description: '登录密码'
        required: false
        default: '123456'
      # release_tag:
      #   description: 'Git 发布标签（如 v1.0.0）'
      #   required: true
      #   default: 'v1.0.0'

jobs:
  build_ova:
    name: 构建 Debian OVA
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 创建 Release 需要写 contents（新仓库默认只读 token 会 403）

    env:
      TARGET_VERSION: ${{ inputs.debian_version }}
      TARGET_BUILD: ${{ github.event.inputs.build_target }}
      TARGET_VCPU: ${{ github.event.inputs.vcpu }}
      TARGET_MEMORY: ${{ github.event.inputs.memory }}
      TARGET_DISK: ${{ github.event.inputs.disk_size }}
      TARGET_HOSTNAME: ${{ github.event.inputs.hostname }}
      TARGET_USERNAME: ${{ github.event.inputs.username }}
      TARGET_PASSWORD: ${{ github.event.inputs.password }}
      TARGET_ENABLE_SSH: ${{ inputs.enable_ssh && 'true' || 'false' }}
      # RELEASE_TAG: ${{ github.event.inputs.release_tag }}

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 安装依赖
        run: |
          echo "[INFO] 正在安装依赖..."
          sudo apt update -qq
          sudo apt install -y wget qemu-utils cloud-image-utils python3
          echo "[INFO] 依赖安装完成"

      - name: 构建 OVA
        id: build
        run: |
          chmod +x ./debian-ova-creator.sh

          # 参数校验（上限防止生成非法 OVF，hostname/密码防 cloud-init 配置破坏）
          if ! [[ "${TARGET_VCPU}" =~ ^[0-9]+$ ]] || [ "${TARGET_VCPU}" -lt 1 ] || [ "${TARGET_VCPU}" -gt 64 ]; then
              echo "[ERROR] vCPU 必须在 1-64 之间"; exit 1
          fi
          if ! [[ "${TARGET_MEMORY}" =~ ^[0-9]+$ ]] || [ "${TARGET_MEMORY}" -lt 256 ] || [ "${TARGET_MEMORY}" -gt 262144 ]; then
              echo "[ERROR] 内存必须在 256-262144 MB 之间"; exit 1
          fi
          if ! [[ "${TARGET_DISK}" =~ ^[0-9]+$ ]] || [ "${TARGET_DISK}" -lt 2 ] || [ "${TARGET_DISK}" -gt 2048 ]; then
              echo "[ERROR] 磁盘必须在 2-2048 GB 之间"; exit 1
          fi
          if ! [[ "${TARGET_HOSTNAME}" =~ ^[a-zA-Z0-9][a-zA-Z0-9-]{0,62}$ ]]; then
              echo "[ERROR] 主机名不合法（字母/数字/连字符，≤63 字符）"; exit 1
          fi
          if ! [[ "${TARGET_PASSWORD}" =~ ^[A-Za-z0-9@#%+=.,_-]+$ ]]; then
              echo "[ERROR] 密码含非法字符（仅允许字母/数字/@#%+=.,_-）"; exit 1
          fi
          case "$TARGET_ENABLE_SSH" in
            true|false) LOGIN_USERNAME="$TARGET_USERNAME" ;;
            *) echo "[ERROR] SSH 开关必须为 true 或 false"; exit 1 ;;
          esac
          if ! [[ "$LOGIN_USERNAME" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]]; then
              echo "[ERROR] 用户名不合法（小写字母开头，字母/数字/_/-，≤32 字符）"; exit 1
          fi
          if [[ "$LOGIN_USERNAME" == root ]]; then
              echo "[ERROR] 非 SSH 镜像请填写普通用户名，附加 SSH 镜像固定使用 root"; exit 1
          fi

          # 校验所选系统版本。
          if ! [[ "$TARGET_VERSION" =~ ^(11|12|13)$ ]]; then
              echo "[ERROR] 不支持的 Debian 版本: $TARGET_VERSION"; exit 1
          fi

          # 解析组合选项：'ESXi 9.0+ + DGNU 13 (vmx-22)' → vmx 机型 + DGNU 标识
          VIRTUAL_SYSTEM_TYPE=$(echo "$TARGET_BUILD" | grep -oE 'vmx-[0-9]+')
          DGNU_NUM=$(echo "$TARGET_BUILD" | grep -oE 'DGNU [0-9]+' | grep -oE '[0-9]+')
          if [ -z "$VIRTUAL_SYSTEM_TYPE" ] || [ -z "$DGNU_NUM" ]; then
              echo "[ERROR] 无法解析构建目标: $TARGET_BUILD"; exit 1
          fi
          export VIRTUAL_SYSTEM_TYPE

          # 组合校验：DGNU 不得超过该机型 ESXi 可识别的最高 osType（防手填非法 dispatch）
          case "$VIRTUAL_SYSTEM_TYPE" in
            vmx-14|vmx-15|vmx-17|vmx-18) MAX_OS=10 ;;
            vmx-19)                       MAX_OS=11 ;;
            vmx-20)                       MAX_OS=12 ;;
            vmx-21|vmx-22)                MAX_OS=13 ;;
          esac
          if [ "$DGNU_NUM" -gt "$MAX_OS" ]; then
              echo "[ERROR] DGNU $DGNU_NUM 超过 $VIRTUAL_SYSTEM_TYPE 可识别上限 $MAX_OS"; exit 1
          fi

          echo "[INFO] 开始构建 OVA，参数如下："
          echo "[INFO] Debian 版本: $TARGET_VERSION"
          echo "[INFO] 构建目标: $TARGET_BUILD"
          echo "[INFO] vCPU: ${TARGET_VCPU}"
          echo "[INFO] 内存: ${TARGET_MEMORY}MB"
          echo "[INFO] 磁盘: ${TARGET_DISK}GB"
          echo "[INFO] ESXi 机型: $VIRTUAL_SYSTEM_TYPE"
          echo "[INFO] 主机名: ${TARGET_HOSTNAME}"
          echo "[INFO] 登录账户: $LOGIN_USERNAME"
          echo "[INFO] 附加 SSH 镜像: $TARGET_ENABLE_SSH"

          # Guest OS 标识：由组合中的 DGNU 直接映射（组合已保证 ≤ 机型可识别上限）
          case "$DGNU_NUM" in
            9)  export OVF_OS_ID=96;  export OVF_OS_TYPE=debian9_64Guest ;;
            10) export OVF_OS_ID=101; export OVF_OS_TYPE=debian10_64Guest ;;
            11) export OVF_OS_ID=96;  export OVF_OS_TYPE=debian11_64Guest ;;
            12) export OVF_OS_ID=96;  export OVF_OS_TYPE=debian12_64Guest ;;
            13) export OVF_OS_ID=96;  export OVF_OS_TYPE=debian13_64Guest ;;
          esac
          echo "[INFO] Guest OS: $OVF_OS_TYPE (ovf:id=$OVF_OS_ID)"

          build_image() {
            local mode="$1" output="$2"
            : > "$output"
            GITHUB_OUTPUT="$output" ./debian-ova-creator.sh \
              -d "$TARGET_VERSION" \
              -c "$TARGET_VCPU" \
              -m "$TARGET_MEMORY" \
              -s "$TARGET_DISK" \
              -H "$TARGET_HOSTNAME" \
              -u "$TARGET_USERNAME" \
              -p "$TARGET_PASSWORD" \
              -S "$mode"
          }
          read_output() {
            python3 - "$1" "$2" <<'PY'
          import sys
          from pathlib import Path
          values = dict(line.split("=", 1) for line in Path(sys.argv[1]).read_text().splitlines())
          print(values[sys.argv[2]])
          PY
          }

          # 默认必建非 SSH 镜像；勾选 SSH 后再额外生成一份。
          CONSOLE_OUTPUT="$RUNNER_TEMP/console-build.outputs"
          build_image false "$CONSOLE_OUTPUT"
          FILE_NAME=$(read_output "$CONSOLE_OUTPUT" OVA_FILE_NAME)
          FILE_SIZE=$(read_output "$CONSOLE_OUTPUT" OVA_FILE_SIZE)
          ACTUAL_DISK_GIB=$(read_output "$CONSOLE_OUTPUT" ACTUAL_DISK_GIB)
          ACTUAL_DISK_BYTES=$(read_output "$CONSOLE_OUTPUT" ACTUAL_DISK_BYTES)
          SSH_FILE_NAME=""
          SSH_FILE_SIZE=""
          if [[ "$TARGET_ENABLE_SSH" == true ]]; then
            SSH_OUTPUT="$RUNNER_TEMP/ssh-build.outputs"
            build_image true "$SSH_OUTPUT"
            SSH_FILE_NAME=$(read_output "$SSH_OUTPUT" OVA_FILE_NAME)
            SSH_FILE_SIZE=$(read_output "$SSH_OUTPUT" OVA_FILE_SIZE)
            if [[ "$(read_output "$SSH_OUTPUT" ACTUAL_DISK_BYTES)" != "$ACTUAL_DISK_BYTES" ]]; then
              echo "[ERROR] 两种镜像的磁盘容量不一致"; exit 1
            fi
          fi
          echo "[INFO] 默认非 SSH 镜像：$FILE_NAME（$FILE_SIZE）"
          if [[ -n "$SSH_FILE_NAME" ]]; then
            echo "[INFO] 附加 SSH 镜像：$SSH_FILE_NAME（$SSH_FILE_SIZE）"
          fi

          # 解析 Debian 官方 build 号（latest 目录页中最大 YYYYMMDD-NNNN），追加到发布标签
          case "$TARGET_VERSION" in
            11) CODENAME="bullseye" ;;
            12) CODENAME="bookworm" ;;
            13) CODENAME="trixie" ;;
          esac
          DEBIAN_BUILD=$(curl -s --max-time 30 "https://cloud.debian.org/images/cloud/${CODENAME}/" | grep -oE '[0-9]{8}-[0-9]+/' | sort -u | tail -1 | tr -d '/') || true
          if [ -z "$DEBIAN_BUILD" ]; then
              echo "[WARN] 未能解析 Debian build 号（网络或目录页结构变化），回退为日期"
              DEBIAN_BUILD=$(date -u +%Y%m%d)
          fi
          echo "[INFO] Debian 官方 build 号：$DEBIAN_BUILD"

          echo "OVA_FILE_NAME=$FILE_NAME" >> "$GITHUB_OUTPUT"
          echo "OVA_FILE_SIZE=$FILE_SIZE" >> "$GITHUB_OUTPUT"
          echo "SSH_FILE_NAME=$SSH_FILE_NAME" >> "$GITHUB_OUTPUT"
          echo "SSH_FILE_SIZE=$SSH_FILE_SIZE" >> "$GITHUB_OUTPUT"
          echo "LOGIN_USERNAME=$LOGIN_USERNAME" >> "$GITHUB_OUTPUT"
          echo "SSH_ENABLED=$TARGET_ENABLE_SSH" >> "$GITHUB_OUTPUT"
          echo "ACTUAL_DISK_GIB=$ACTUAL_DISK_GIB" >> "$GITHUB_OUTPUT"
          echo "ACTUAL_DISK_BYTES=$ACTUAL_DISK_BYTES" >> "$GITHUB_OUTPUT"
          echo "BUILD_TIME=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"
          echo "DEBIAN_BUILD=$DEBIAN_BUILD" >> "$GITHUB_OUTPUT"
          echo "FINAL_TAG=${DEBIAN_BUILD}" >> "$GITHUB_OUTPUT"
          echo "TARGET_VERSION=$TARGET_VERSION" >> "$GITHUB_OUTPUT"
          echo "VIRTUAL_SYSTEM_TYPE=$VIRTUAL_SYSTEM_TYPE" >> "$GITHUB_OUTPUT"

      - name: 创建 GitHub Release
        # 自定义 if 会替换默认 success() 检查，必须显式带 success()，否则构建失败后仍会执行
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGIN_USERNAME: ${{ steps.build.outputs.LOGIN_USERNAME }}
          SSH_ENABLED: ${{ steps.build.outputs.SSH_ENABLED }}
          ACTUAL_DISK_GIB: ${{ steps.build.outputs.ACTUAL_DISK_GIB }}
          BUILD_VERSION: ${{ steps.build.outputs.TARGET_VERSION }}
          DEBIAN_BUILD: ${{ steps.build.outputs.DEBIAN_BUILD }}
          OVA_FILE_SIZE: ${{ steps.build.outputs.OVA_FILE_SIZE }}
          BUILD_TIME: ${{ steps.build.outputs.BUILD_TIME }}
          FINAL_TAG: ${{ steps.build.outputs.FINAL_TAG }}
          OVA_FILE_NAME: ${{ steps.build.outputs.OVA_FILE_NAME }}
          SSH_FILE_NAME: ${{ steps.build.outputs.SSH_FILE_NAME }}
          SSH_FILE_SIZE: ${{ steps.build.outputs.SSH_FILE_SIZE }}
        run: |
          ASSETS=("$OVA_FILE_NAME")
          SSH_ROW=""
          if [[ -n "$SSH_FILE_NAME" ]]; then
              ASSETS+=("$SSH_FILE_NAME")
              SSH_ROW="| 附加 SSH 镜像 | $SSH_FILE_NAME | root | SSH 密码登录 | $SSH_FILE_SIZE |"
          fi
          RELEASE_NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          cat > "$RELEASE_NOTES_FILE" <<EOF
          ## Debian 云镜像 OVA

          **构建配置：**
          - Debian 版本：**${BUILD_VERSION}**
          - Debian Build 号：**${DEBIAN_BUILD}**
          - vCPU：**${TARGET_VCPU}**
          - 内存：**${TARGET_MEMORY}MB**
          - 磁盘大小：**${ACTUAL_DISK_GIB} GB**
          - 主机名：**${TARGET_HOSTNAME}**
          - 默认镜像：**非 SSH（控制台登录）**
          - 构建时间：**${BUILD_TIME}**

          | 镜像 | 文件 | 登录账户 | 登录方式 | 文件大小 |
          | --- | --- | --- | --- | --- |
          | 默认非 SSH 镜像 | ${OVA_FILE_NAME} | ${LOGIN_USERNAME} | 虚拟机控制台 | ${OVA_FILE_SIZE} |
          ${SSH_ROW}

          **快速开始：**
          1. 从 Release 资产中下载 OVA 文件
          2. 导入 VMware 或兼容的虚拟化平台
          3. 开机并使用以下凭据登录：
             - 默认非 SSH 镜像：通过虚拟机控制台登录，用户名 \`${LOGIN_USERNAME}\`
             - SSH 镜像（如有）：等待 cloud-init 完成后执行 \`ssh root@<虚拟机 IP>\`
             - 密码：\`${TARGET_PASSWORD}\`

          **Cloud-Init 支持：**
          - 自定义主机名配置
          - 默认配置普通用户，附加 SSH 镜像配置 root
          - 执行 user-data 脚本
          EOF

          # 同 tag 复用：Release 已存在则追加 OVA 资产（保留之前编译的其他 ESXi 版本镜像），不存在则创建
          if gh release view "${FINAL_TAG}" >/dev/null 2>&1; then
              gh release upload "${FINAL_TAG}" \
                "${ASSETS[@]}" --clobber
              # 每次只展示最新成功构建的一份完整说明，历史下载资产保留。
              gh release edit "$FINAL_TAG" \
                --title "Debian ${BUILD_VERSION} OVA - ${FINAL_TAG}" \
                --notes-file "$RELEASE_NOTES_FILE"
              echo "[INFO] Release 已更新，已上传 ${#ASSETS[@]} 份镜像"
          else
              gh release create "${FINAL_TAG}" \
                "${ASSETS[@]}" \
                --title "Debian ${BUILD_VERSION} OVA - ${FINAL_TAG}" \
                --notes-file "$RELEASE_NOTES_FILE"
              echo "[INFO] Release 创建完成：${FINAL_TAG}"
          fi

      - name: 构建摘要
        if: always()
        env:
          BUILD_STATUS: ${{ job.status }}
          LOGIN_USERNAME: ${{ steps.build.outputs.LOGIN_USERNAME }}
          SSH_ENABLED: ${{ steps.build.outputs.SSH_ENABLED }}
          ACTUAL_DISK_GIB: ${{ steps.build.outputs.ACTUAL_DISK_GIB }}
          BUILD_VERSION: ${{ steps.build.outputs.TARGET_VERSION }}
          DEBIAN_BUILD: ${{ steps.build.outputs.DEBIAN_BUILD }}
          OVA_FILE_SIZE: ${{ steps.build.outputs.OVA_FILE_SIZE }}
          BUILD_TIME: ${{ steps.build.outputs.BUILD_TIME }}
          FINAL_TAG: ${{ steps.build.outputs.FINAL_TAG }}
          OVA_FILE_NAME: ${{ steps.build.outputs.OVA_FILE_NAME }}
          SSH_FILE_NAME: ${{ steps.build.outputs.SSH_FILE_NAME }}
          SSH_FILE_SIZE: ${{ steps.build.outputs.SSH_FILE_SIZE }}
        run: |
          echo ""
          echo "[INFO] Debian OVA 构建状态: ${BUILD_STATUS}"
          echo "[INFO] 版本: ${BUILD_VERSION}"
          echo "[INFO] vCPU: ${TARGET_VCPU}"
          echo "[INFO] 内存: ${TARGET_MEMORY}MB"
          echo "[INFO] 请求磁盘容量: ${TARGET_DISK} GiB"
          echo "[INFO] 实际磁盘容量: ${ACTUAL_DISK_GIB:-未生成} GiB"
          echo "[INFO] ESXi 机型: ${TARGET_BUILD}"
          echo "[INFO] 主机名: ${TARGET_HOSTNAME}"
          echo "[INFO] 登录账户: ${LOGIN_USERNAME:-未生成}"
          echo "[INFO] 附加 SSH 镜像: ${SSH_ENABLED:-未生成}"
          echo "[INFO] 标签: ${FINAL_TAG}"
          if [ -n "${OVA_FILE_NAME}" ]; then
            echo "[INFO] 文件: ${OVA_FILE_NAME}"
            echo "[INFO] 大小: ${OVA_FILE_SIZE}"
          fi
          if [[ -n "$SSH_FILE_NAME" ]]; then
            echo "[INFO] 附加 SSH 镜像: $SSH_FILE_NAME（$SSH_FILE_SIZE）"
          fi
          echo ""

          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            {
              printf '## Debian %s OVA 构建结果\n\n' "$TARGET_VERSION"
              printf -- '- 状态：%s\n' "$BUILD_STATUS"
              printf -- '- 登录账户：%s\n' "${LOGIN_USERNAME:-未生成}"
              printf -- '- 默认非 SSH 镜像：%s\n' "${OVA_FILE_NAME:-未生成}"
              printf -- '- 附加 SSH 镜像：%s\n' "${SSH_FILE_NAME:-无}"
              printf -- '- 请求磁盘容量：%s GiB\n' "$TARGET_DISK"
              if [[ -n "$ACTUAL_DISK_GIB" ]]; then
                printf -- '- 实际磁盘容量：%s GiB\n' "$ACTUAL_DISK_GIB"
                printf '\n实际容量按请求容量与源镜像容量中的较大值构建。\n'
              else
                printf -- '- 实际磁盘容量：未生成\n'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 清理
        if: always()
        run: |
          rm -f *.qcow2 *.vmdk *.ovf *.mf *.ova cidata.iso 2>/dev/null || true
          echo "[INFO] 清理完成"
