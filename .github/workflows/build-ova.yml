        required: false
        default: 'debian'
      password:
        description: '登录密码'
        required: false
        default: '123456'

# Serialize updates of one channel/version; test uses separate prerelease tags.
concurrency:
  group: ova-${{ github.ref }}-debian-${{ inputs.debian_version }}
  cancel-in-progress: false
  queue: max

jobs:
  build_ova:
    name: 构建 Debian OVA
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TARGET_VERSION: ${{ inputs.debian_version }}
      TARGET_BUILD: ${{ inputs.build_target }}
      TARGET_BUILD_2: ${{ inputs.build_target_2 }}
      TARGET_BUILD_3: ${{ inputs.build_target_3 }}
      TARGET_BUILD_4: ${{ inputs.build_target_4 }}
      TARGET_VCPU: ${{ inputs.vcpu }}
      TARGET_MEMORY: ${{ inputs.memory }}
      TARGET_DISK: ${{ inputs.disk_size }}
      TARGET_HOSTNAME: ${{ inputs.hostname }}
      TARGET_USERNAME: ${{ inputs.username }}
      TARGET_PASSWORD: ${{ inputs.password }}
      TARGET_ENABLE_SSH: ${{ inputs.enable_ssh && 'true' || 'false' }}
      TARGET_APT_MIRROR: ${{ inputs.apt_mirror }}
      TARGET_INSTALL_VM_TOOLS: ${{ inputs.install_vm_tools && 'true' || 'false' }}
      TARGET_TIMEZONE: ${{ inputs.timezone }}

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 安装依赖
        run: |
          sudo apt update -qq
          sudo apt install -y --no-install-recommends qemu-utils cloud-image-utils python3 guestfish

      - name: 构建 OVA
        id: build
        run: python3 scripts/build.py

      - name: 创建 GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_MANIFEST: ${{ steps.build.outputs.BUILD_MANIFEST }}
          FINAL_TAG: ${{ steps.build.outputs.FINAL_TAG }}
        run: bash scripts/publish.sh

      - name: 构建摘要
        if: always()
        env:
          BUILD_STATUS: ${{ job.status }}
          BUILD_MANIFEST: ${{ steps.build.outputs.BUILD_MANIFEST }}
        run: python3 scripts/report.py summary

      - name: 清理
        if: always()
        run: |
          rm -f -- ./*.qcow2 ./*.vmdk ./*.ovf ./*.mf ./*.ova ./*.ova.part ./*.source.sha512 ./*.growroot-prepared.sha256 ./*.growroot-verified.sha256 ./cidata.iso
