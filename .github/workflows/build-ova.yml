          - 'ESXi 7.0 U2/U3 + DGNU 9 (vmx-19)'
          - 'ESXi 7.0 U2/U3 + DGNU 10 (vmx-19)'
          - 'ESXi 7.0 U3 + DGNU 11 (vmx-19)'
          - 'ESXi 8.0 / 8.0 U1 + DGNU 9 (vmx-20)'
